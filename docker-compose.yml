version: '3.8'

services:
  # ─── 1. خادم قاعدة البيانات MongoDB ─────────────────────────
  mongo:
    image: mongo:7-jammy
    container_name: amazon_furniture_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=amazon_furniture
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 2. خادم الباك إند (Express.js API + Socket.io) ────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amazon_furniture_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:3000
      - MONGO_URI=mongodb://mongo:27017/amazon_furniture
      - JWT_SECRET=super_secret_jwt_key_min_32_characters_random_string_2026!
      - JWT_EXPIRES_IN=7d
      - EMAIL_SERVICE=gmail
      - EMAIL_USER=support@amazonfurniture.eg
      - EMAIL_PASS=mock_app_password_1234
      - EMAIL_FROM=Amazon Furniture <support@amazonfurniture.eg>
      - ADMIN_NOTIFICATION_EMAIL=admin@amazonfurniture.eg
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-amazon-furniture}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - backend_backups:/app/backups
    networks:
      - app-network

volumes:
  mongo_data:
    driver: local
  backend_backups:
    driver: local

networks:
  app-network:
    driver: bridge
