name: ✅ CI — Type Check, Build & Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: 🧪 Build & Test Verification
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      JWT_SECRET: test_secret_key_amazon_furniture_production_ready_2026
      MONGO_URI: mongodb://127.0.0.1:27017/amazon_furniture_test
      EMAIL_SERVICE: mock
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-ECOMFURNITURE
      NEXT_PUBLIC_META_PIXEL_ID: 987654321098765

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            ecom-furniture-main/ecom-furniture-main/package-lock.json

      # ─── 1. Backend Verification ───────────────────────────
      - name: 📦 Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: 🛡️ Run Backend Database & Security Validation Tests
        run: |
          cd backend
          npx jest tests/database.test.js --runInBand --detectOpenHandles --forceExit

      # ─── 2. Frontend Verification ──────────────────────────
      - name: 📦 Install Frontend Dependencies
        run: |
          cd ecom-furniture-main/ecom-furniture-main
          npm ci

      - name: 🏗️ Next.js Production Build (28 Pages Static Generation)
        run: |
          cd ecom-furniture-main/ecom-furniture-main
          npm run build

      - name: 📋 Quality Gate Passed
        run: |
          echo "========================================================"
          echo "🎉 All quality checks, builds, and unit tests passed!"
          echo "✅ Frontend 28 pages generated successfully."
          echo "✅ Backend models, validation schemas, and security passed."
          echo "========================================================"
