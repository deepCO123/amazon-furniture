name: 🚀 Production VPS Deployment (Manual Trigger)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        default: 'production'

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 🌐 Deploy to Ubuntu VPS
    runs-on: ubuntu-latest

    steps:
      - name: 🔍 Check SSH Configuration
        id: check_ssh
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "⚠️ [Notice] SSH_HOST secret is not configured in this repository."
            echo "ℹ️ Deployment step will be skipped safely without failure."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: 🔐 Execute Remote Deployment via SSH
        if: steps.check_ssh.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            echo "========================================================"
            echo "🚀 بدء عملية النشر لسيرفر الإنتاج..."
            echo "========================================================"
            cd /var/www/amazon-furniture || exit 1
            echo "📁 المسار الحالي: $(pwd)"
            echo "📥 جاري سحب أحدث التحديثات من GitHub..."
            git fetch origin main
            git reset --hard origin/main
            echo "🐳 جاري إعادة بناء وتشغيل الحاويات (Docker Compose)..."
            docker compose up -d --build
            echo "🧹 تنظيف الصور المؤقتة..."
            docker image prune -f
            echo "========================================================"
            echo "✅ حالة الحاويات بعد النشر:"
            docker compose ps
            echo "========================================================"
            echo "🎉 تم النشر بنجاح والموقع يعمل بكفاءة!"

      - name: 📋 Deployment Status Summary
        run: |
          if [ "${{ steps.check_ssh.outputs.configured }}" = "true" ]; then
            echo "✅ Deployment completed successfully."
          else
            echo "ℹ️ VPS deployment bypassed safely: To enable automated VPS deploy, add SSH_HOST, SSH_USERNAME, and SSH_PRIVATE_KEY to GitHub Repository Secrets."
          fi
