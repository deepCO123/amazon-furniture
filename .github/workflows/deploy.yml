name: 🚀 Production VPS Deployment (Manual Trigger)

on:
  workflow_dispatch: # يتم التشغيل يدوياً فقط عند رغبتك بالضغط على Run Workflow من واجهة GitHub
  # push:
  #   branches:
  #     - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 🌐 Deploy to Ubuntu VPS
    runs-on: ubuntu-latest
    if: "${{ secrets.SSH_HOST != '' }}" # يتم التخطي بأمان في حال عدم إدخال الـ Secrets

    steps:
      - name: 🔐 Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            echo "========================================================"
            echo "🚀 بدء عملية النشر لسيرفر الإنتاج..."
            echo "========================================================"

            # 1. الانتقال إلى مسار المشروع على السيرفر
            cd /var/www/amazon-furniture || exit 1
            echo "📁 المسار الحالي: $(pwd)"

            # 2. سحب أحدث نسخة من الكود المصدري من فرع main
            echo "📥 جاري سحب أحدث التحديثات من GitHub..."
            git fetch origin main
            git reset --hard origin/main

            # 3. إعادة بناء وتشغيل حاويات Docker في الخلفية
            echo "🐳 جاري إعادة بناء وتشغيل الحاويات (Docker Compose)..."
            docker compose up -d --build

            # 4. تنظيف الصور القديمة غير المستخدمة لتوفير مساحة القرص
            echo "🧹 تنظيف الصور المؤقتة..."
            docker image prune -f

            # 5. فحص وتأكيد حالة الحاويات
            echo "========================================================"
            echo "✅ حالة الحاويات بعد النشر:"
            docker compose ps
            echo "========================================================"
            echo "🎉 تم النشر بنجاح والموقع يعمل بكفاءة!"
